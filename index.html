<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acorn Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink: #211f1d;
      --muted: #6f6962;
      --line: #d8d1c7;
      --paper: #f7f1e7;
      --panel: #fffaf0;
      --soft: #eee3d3;
      --orange: #f47b20;
      --green: #249c6b;
      --blue: #3678d8;
      --red: #d84d3b;
      --yellow: #f3b43f;
      --purple: #7b61d1;
      --shadow: 0 10px 30px rgba(37, 31, 24, .08);
    }

    body.dark {
      --ink: #f3ede4;
      --muted: #b7aa9b;
      --line: #443d35;
      --paper: #171411;
      --panel: #231f1a;
      --soft: #332c25;
      --shadow: 0 10px 30px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(33, 31, 29, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(33, 31, 29, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 22px 22px;
    }

    button, input, select { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 240, .88);
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 18px;
    }

    .mark {
      width: 30px;
      height: 30px;
      border: 2px solid var(--ink);
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: var(--orange);
      box-shadow: 3px 3px 0 var(--ink);
    }

    nav { display: grid; gap: 4px; }

    .nav-button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
    }

    .nav-button.active, .nav-button:hover {
      color: var(--ink);
      background: var(--soft);
      border-color: var(--line);
    }

    main { min-width: 0; }

    header {
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 241, 231, .9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2vw, 28px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtle { color: var(--muted); font-size: 13px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill, .icon-button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 7px;
      min-height: 34px;
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 0 rgba(33, 31, 29, .06);
    }

    .icon-button { width: 36px; justify-content: center; cursor: pointer; }

    .content {
      padding: 18px 22px 28px;
      display: grid;
      gap: 16px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
    }

    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .card {
      padding: 14px;
      min-height: 104px;
      display: grid;
      gap: 8px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 700;
    }

    .value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
    }

    .delta {
      font-size: 13px;
      color: var(--green);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, .9fr);
      gap: 16px;
      align-items: start;
    }

    .panel-header {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body { padding: 14px; }

    .chart {
      width: 100%;
      height: 100% !important;
      display: block;
    }

    .chart-box {
      height: 230px;
      width: 100%;
      position: relative;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      border: 1px solid rgba(0,0,0,.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th { color: var(--muted); font-size: 12px; font-weight: 750; }

    tr:last-child td { border-bottom: 0; }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
      min-width: 90px;
    }

    .bar > span { display: block; height: 100%; background: var(--orange); }

    .funnel {
      display: grid;
      gap: 9px;
    }

    .step {
      display: grid;
      grid-template-columns: 88px 1fr 52px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .step-track {
      height: 28px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .step-fill {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      color: #16110c;
      font-weight: 800;
      background: linear-gradient(90deg, #ffc65c, var(--orange));
    }

    .retention {
      display: grid;
      grid-template-columns: 92px repeat(7, minmax(38px, 1fr));
      gap: 5px;
      align-items: stretch;
      font-size: 12px;
    }

    .cell {
      min-height: 32px;
      border-radius: 6px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      background: var(--soft);
      font-weight: 700;
    }

    .cohort-name {
      justify-content: start;
      padding-left: 8px;
      color: var(--muted);
      font-weight: 700;
      background: transparent;
      border-color: transparent;
    }

    .flags { display: grid; gap: 10px; }

    .flag {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--soft);
      position: relative;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
      transition: .18s ease;
    }

    .switch.on { background: #dff3e8; border-color: #9ad7b8; }
    .switch.on::after { left: 21px; background: var(--green); }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 7px;
      padding: 6px 9px;
      cursor: pointer;
      color: var(--muted);
    }

    .tab.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }

    .event-stream {
      display: grid;
      gap: 8px;
      max-height: 292px;
      overflow: auto;
      padding-right: 4px;
    }

    .event {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 9px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      font-size: 13px;
    }

    body.dark .flag,
    body.dark .event {
      background: #2d271f;
      color: var(--ink);
    }

    body.dark .event-icon {
      background: #3a332a;
    }

    .event-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .nav-button { justify-content: center; font-size: 12px; padding: 8px 6px; }
      .nav-button span:last-child { display: none; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid, .footer-grid { grid-template-columns: 1fr; }
      header { position: static; align-items: flex-start; }
    }

    @media (max-width: 620px) {
      header { flex-direction: column; }
      .content { padding: 14px; }
      .metrics { grid-template-columns: 1fr; }
      .retention { grid-template-columns: 76px repeat(7, minmax(28px, 1fr)); font-size: 10px; gap: 3px; }
      .cell { min-height: 27px; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><div class="mark">◆</div><span>Acme Analytics</span></div>
      <nav aria-label="Primary">
        <button class="nav-button active"><span>⌁</span><span>Events</span></button>
        <button class="nav-button"><span>◴</span><span>Funnels</span></button>
        <button class="nav-button"><span>▦</span><span>Retention</span></button>
        <button class="nav-button"><span>◫</span><span>Cohorts</span></button>
        <button class="nav-button"><span>⚑</span><span>Feature Flags</span></button>
      </nav>
    </aside>
    <main>
      <header>
        <div>
          <h1>Acme Analytics</h1>
          <div class="subtle">Mock workspace: web app, production, last 30 days</div>
        </div>
        <div class="toolbar">
          <input class="pill" id="search" type="search" placeholder="Search events, cohorts, flags" aria-label="Search analytics">
          <select class="pill" id="segment">
            <option>All users</option>
            <option>Activated teams</option>
            <option>New signups</option>
          </select>
          <select class="pill" id="dateRange" aria-label="Date range">
            <option>Last 30 days</option>
            <option>Last 14 days</option>
            <option>Last 7 days</option>
          </select>
          <button class="icon-button" title="Toggle dark mode" id="theme">◐</button>
          <button class="icon-button" title="Refresh data" id="refresh">↻</button>
          <button class="pill" id="export">Export</button>
        </div>
      </header>

      <section class="content">
        <div class="metrics" id="metrics"></div>

        <div class="grid">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">⌁ Event volume</div>
              <div class="tabs">
                <button class="tab active" data-range="30">30d</button>
                <button class="tab" data-range="14">14d</button>
                <button class="tab" data-range="7">7d</button>
              </div>
            </div>
            <div class="panel-body">
              <div class="chart-box">
                <canvas class="chart" id="volumeChart" width="900" height="300" aria-label="Event volume chart"></canvas>
              </div>
              <div class="legend">
                <span><i class="dot" style="background:var(--orange)"></i>Pageviews</span>
                <span><i class="dot" style="background:var(--blue)"></i>Signups</span>
                <span><i class="dot" style="background:var(--green)"></i>Feature used</span>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header"><div class="panel-title">◴ Activation funnel</div><span class="subtle">8,420 users</span></div>
            <div class="panel-body"><div class="funnel" id="funnel"></div></div>
          </section>
        </div>

        <div class="footer-grid">
          <section class="panel">
            <div class="panel-header"><div class="panel-title">▦ Weekly retention</div><span class="subtle">Cohort heatmap</span></div>
            <div class="panel-body"><div class="retention" id="retention"></div></div>
          </section>

          <section class="panel">
              <div class="panel-header"><div class="panel-title">⚑ Feature flags</div><span class="subtle" id="flagSummary">Rollouts</span></div>
            <div class="panel-body"><div class="flags" id="flags"></div></div>
          </section>
        </div>

        <div class="grid">
          <section class="panel">
            <div class="panel-header"><div class="panel-title">◫ Cohorts</div><span class="subtle">Dynamic groups</span></div>
            <div class="panel-body">
              <table>
                <thead><tr><th>Name</th><th>Users</th><th>Growth</th><th>Definition</th><th>Match</th></tr></thead>
                <tbody id="cohorts"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header"><div class="panel-title">● Live event stream</div><span class="subtle" id="clock"></span></div>
            <div class="panel-body"><div class="event-stream" id="events"></div></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    const colors = {
      orange: "#f47b20",
      blue: "#3678d8",
      green: "#249c6b",
      red: "#d84d3b",
      line: "#d8d1c7",
      muted: "#6f6962",
      ink: "#211f1d"
    };

    let chart;

    const state = {
      range: 30,
      metrics: [
        ["Total events", "1.28M", "+18.4%"],
        ["Active users", "48,921", "+7.2%"],
        ["Activation", "41.8%", "+3.1%"],
        ["Revenue signals", "$92.4K", "+11.6%"]
      ],
      series: Array.from({ length: 30 }, (_, i) => ({
        day: i + 1,
        pageviews: 520 + Math.round(Math.sin(i / 3) * 80) + i * 12,
        signups: 120 + Math.round(Math.cos(i / 4) * 24) + i * 3,
        used: 210 + Math.round(Math.sin(i / 5) * 42) + i * 6
      })),
      funnel: [
        ["Visited pricing", 8420, 100],
        ["Started trial", 5270, 62.6],
        ["Invited teammate", 3190, 37.9],
        ["Created insight", 2440, 29.0],
        ["Enabled flag", 1610, 19.1]
      ],
      cohorts: [
        ["Power users", "7,812", "+22%", ">= 12 events / week", 84],
        ["Expansion-ready", "1,942", "+15%", "3+ seats and flag use", 68],
        ["At risk", "3,406", "-8%", "No event in 10 days", 31],
        ["Billing admins", "924", "+5%", "Viewed billing twice", 55]
      ],
      flags: [
        ["new-query-builder", "68% rollout", "Power users, Expansion-ready", true],
        ["session-replay-v2", "22% beta cohort", "Power users", true],
        ["billing-redesign", "internal only", "Billing admins", false],
        ["warehouse-sync", "12 accounts", "Expansion-ready", true],
        ["pricing-page-ai", "35% rollout", "New signups", false]
      ],
      events: ["pageview", "signup", "feature_flag_called", "insight_saved", "funnel_completed", "cohort_matched", "billing_viewed", "invite_sent"]
    };

    function renderMetrics() {
      document.getElementById("metrics").innerHTML = state.metrics.map(([label, value, delta]) => `
        <article class="card">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
          <div class="delta">${delta} vs previous period</div>
        </article>
      `).join("");
    }

    function drawChart() {
      const data = state.series.slice(-state.range);
      const chartData = {
        labels: data.map(d => `Day ${d.day}`),
        datasets: [
          { label: "Pageviews", data: data.map(d => d.pageviews), borderColor: colors.orange, backgroundColor: "rgba(244,123,32,.12)", tension: .35, fill: true },
          { label: "Signups", data: data.map(d => d.signups), borderColor: colors.blue, backgroundColor: "rgba(54,120,216,.08)", tension: .35 },
          { label: "Feature used", data: data.map(d => d.used), borderColor: colors.green, backgroundColor: "rgba(36,156,107,.08)", tension: .35 }
        ]
      };
      if (chart) {
        chart.data = chartData;
        chart.update();
        return;
      }
      chart = new Chart(document.getElementById("volumeChart"), {
        type: "line",
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: "index" },
          plugins: { legend: { display: false }, tooltip: { backgroundColor: colors.ink, padding: 10 } },
          scales: {
            x: { grid: { display: false }, ticks: { color: colors.muted, maxTicksLimit: 6 } },
            y: { grid: { color: "rgba(111,105,98,.22)" }, ticks: { color: colors.muted } }
          }
        }
      });
    }

    function renderFunnel() {
      document.getElementById("funnel").innerHTML = state.funnel.map(([name, count, pct]) => `
        <div class="step">
          <strong>${name}</strong>
          <div class="step-track"><div class="step-fill" style="width:${pct}%">${count.toLocaleString()}</div></div>
          <span>${pct}%</span>
        </div>
      `).join("");
    }

    function renderRetention() {
      const weeks = ["Cohort", "W0", "W1", "W2", "W3", "W4", "W5", "W6"];
      const rows = [
        ["May 20", 100, 64, 48, 39, 32, 28, 25],
        ["May 13", 100, 61, 44, 36, 31, 24, 21],
        ["May 06", 100, 58, 41, 33, 27, 22, 19],
        ["Apr 29", 100, 55, 38, 29, 24, 20, 16],
        ["Apr 22", 100, 52, 34, 27, 20, 17, 14]
      ];
      document.getElementById("retention").innerHTML =
        weeks.map(w => `<div class="cell cohort-name">${w}</div>`).join("") +
        rows.map(row => row.map((v, i) => {
          if (i === 0) return `<div class="cell cohort-name">${v}</div>`;
          const alpha = Math.max(.12, v / 110);
          return `<div class="cell" style="background:rgba(36,156,107,${alpha})">${v}%</div>`;
        }).join("")).join("");
    }

    function renderCohorts() {
      document.getElementById("cohorts").innerHTML = state.cohorts.map(([name, users, growth, def, match]) => `
        <tr>
          <td><strong>${name}</strong></td>
          <td>${users}</td>
          <td style="color:${growth.startsWith("-") ? colors.red : colors.green};font-weight:800">${growth}</td>
          <td>${def}</td>
          <td><div class="bar"><span style="width:${match}%"></span></div></td>
        </tr>
      `).join("");
    }

    function renderFlags() {
      document.getElementById("flags").innerHTML = state.flags.map(([name, rollout, cohorts, on], index) => `
        <div class="flag">
          <div><strong>${name}</strong><div class="subtle">${rollout} · ${cohorts} · <span data-flag-status="${index}">${on ? "enabled" : "paused"}</span></div></div>
          <button class="switch ${on ? "on" : ""}" data-flag="${index}" aria-label="Toggle ${name}"></button>
        </div>
      `).join("");
      document.getElementById("flagSummary").textContent = `${state.flags.filter(f => f[3]).length}/${state.flags.length} enabled`;
      document.querySelectorAll(".switch").forEach(button => button.addEventListener("click", () => {
        const index = Number(button.dataset.flag);
        state.flags[index][3] = !state.flags[index][3];
        button.classList.toggle("on", state.flags[index][3]);
        document.querySelector(`[data-flag-status="${index}"]`).textContent = state.flags[index][3] ? "enabled" : "paused";
        document.getElementById("flagSummary").textContent = `${state.flags.filter(f => f[3]).length}/${state.flags.length} enabled`;
      }));
    }

    function renderEvents() {
      const people = ["sam@demo.io", "riley@demo.io", "ana@demo.io", "devon@demo.io", "mika@demo.io"];
      const stream = Array.from({ length: 18 }, (_, i) => ({
        name: state.events[(i + Math.floor(Math.random() * state.events.length)) % state.events.length],
        user: people[(i + Math.floor(Math.random() * people.length)) % people.length],
        age: `${Math.max(1, i * 3 + Math.floor(Math.random() * 4))}m`
      }));
      document.getElementById("events").innerHTML = stream.map(e => `
        <div class="event">
          <div class="event-icon">●</div>
          <div><strong>${e.name}</strong><div class="subtle">${e.user}</div></div>
          <span class="subtle">${e.age}</span>
        </div>
      `).join("");
      document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function boot() {
      renderMetrics();
      renderFunnel();
      renderRetention();
      renderCohorts();
      renderFlags();
      renderEvents();
      drawChart();
    }

    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      state.range = Number(tab.dataset.range);
      drawChart();
    }));

    document.getElementById("refresh").addEventListener("click", () => {
      state.series = state.series.map(d => ({
        ...d,
        pageviews: d.pageviews + Math.round(Math.random() * 50 - 12),
        signups: d.signups + Math.round(Math.random() * 16 - 4),
        used: d.used + Math.round(Math.random() * 28 - 8)
      }));
      renderEvents();
      drawChart();
    });

    document.getElementById("dateRange").addEventListener("change", event => {
      state.range = Number(event.target.value.match(/\d+/)[0]);
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", Number(tab.dataset.range) === state.range));
      drawChart();
    });

    document.getElementById("theme").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      if (chart) chart.update();
    });

    document.getElementById("search").addEventListener("input", event => {
      const query = event.target.value.trim().toLowerCase();
      document.querySelectorAll(".event, .flag").forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? "" : "none";
      });
    });

    document.getElementById("export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "acorn-analytics-mock-data.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener("resize", drawChart);
    boot();
  </script>
</body>
</html>
